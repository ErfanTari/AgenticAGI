<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tetris Implementation</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-color: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --accent-color: #00f2ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1200px;
        }

        #game-wrapper {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 40px;
            transform: rotateX(10deg) rotateY(-5deg);
            transform-style: preserve-3d;
        }

        #ui-panel {
            background: var(--panel-color);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateZ(30px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        #game-container {
            position: relative;
            width: 300px;
            height: 600px;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #222;
            border-radius: 10px;
            transform-style: preserve-3d;
            box-shadow: 
                0 0 20px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(0,0,0,1);
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            width: 100%;
            height: 100%;
        }

        .cell {
            width: 30px;
            height: 30px;
            box-sizing: border-box;
            border: 0.5px solid rgba(255, 255, 255, 0.02);
        }

        /* The 3D Block Effect */
        .block {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .block-face {
            position: absolute;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        /* Using box-shadow and pseudo-elements to simulate 3D depth without heavy geometry */
        .active-block {
            background-color: var(--block-color);
            box-shadow: 
                inset -4px -4px 0 rgba(0,0,0,0.3),
                inset 4px 4px 0 rgba(255,255,255,0.2),
                0 0 15px var(--block-color);
            transform: translateZ(5px);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        button {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .combo-flash {
            animation: pulse 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="ui-panel">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Lines</span>
                <span id="lines" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Combo</span>
                <span id="combo" class="stat-value">0</span>
            </div>
        </div>

        <div id="game-container">
            <div id="grid"></div>
            
            <div id="overlay">
                <h2 id="overlay-title">TETRIS 3D</h2>
                <button id="start-btn">Start Game</button>
            </div>
        </div>
    </div>

    <script>
        const GRID_WIDTH = 10;
        const GRID_HEIGHT = 20;
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const linesElement = document.getElementById('lines');
        const comboElement = document.getElementById('combo');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let lines = 0;
        let combo = 0;
        let gameActive = false;
        let board = [];
        let currentPiece = null;
        let dropCounter = 0;
        let lastTime = 0;
        let dropInterval = 1000;

        const COLORS = {
            'I': '#00f2ff',
            'J': '#0044ff',
            'L': '#ffaa00',
            'O': '#ffff00',
            'S': '#00ff44',
            'T': '#9d00ff',
            'Z': '#ff0044'
        };

        const SHAPES = {
            'I': [[1, 1, 1, 1]],
            'J': [[1, 0, 0], [1, 1, 1]],
            'L': [[0, 0, 1], [1, 1, 1]],
            'O': [[1, 1], [1, 1]],
            'S': [[0, 1, 1], [1, 1, 0]],
            'T': [[0, 1, 0], [1, 1, 1]],
            'Z': [[1, 1, 0], [0, 1, 1]]
        };

        // Initialize Grid DOM
        function initGrid() {
            gridElement.innerHTML = '';
            for (let i = 0; i < GRID_WIDTH * GRID_HEIGHT; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                gridElement.appendChild(cell);
            }
        }

        // Initialize Board Data
        function initBoard() {
            board = Array.from({ length: GRID_HEIGHT }, () => Array(GRID_WIDTH).fill(null));
        }

        class Piece {
            constructor(type) {
                this.type = type;
                this.shape = SHAPES[type];
                this.color = COLORS[type];
                this.x = Math.floor(GRID_WIDTH / 2) - Math.floor(this.shape[0].length / 2);
                this.y = 0;
            }

            rotate() {
                const newShape = this.shape[0].map((_, colIndex) => 
                    this.shape.map(row => row[colIndex]).reverse()
                );
                // Check collision after rotation
                if (!this.checkCollision(this.y, this.x, newShape)) {
                    this.shape = newShape;
                }
            }

            checkCollision(y, x, shape = this.shape) {
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c]) {
                            let newY = y + r;
                            let newX = x + c;
                            if (newY >= GRID_HEIGHT || newX < 0 || newX >= GRID_WIDTH || (newY >= 0 && board[newY][newX])) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
        }

        function createPiece() {
            const types = Object.keys(SHAPES);
            const type = types[Math.floor(Math.random() * types.length)];
            return new Piece(type);
        }

        function updateGridDOM() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('active-block');
                cell.style.backgroundColor = 'transparent';
            });

            // Draw Board
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (board[y][x]) {
                        const index = y * GRID_WIDTH + x;
                        const cell = cells[index];
                        cell.style.backgroundColor = board[y][x];
                        cell.classList.add('active-block');
                        cell.style.setProperty('--block-color', board[y][x]);
                    }
                }
            }

            // Draw Current Piece
            if (currentPiece) {
                currentPiece.shape.forEach((row, r) => {
                    row.forEach((value, c) => {
                        if (value) {
                            const y = currentPiece.y + r;
                            const x = currentPiece.x + c;
                            if (y >= 0 && y < GRID_HEIGHT && x >= 0 && x < GRID_WIDTH) {
                                const index = y * GRID_WIDTH + x;
                                const cell = cells[index];
                                cell.style.backgroundColor = currentPiece.color;
                                cell.classList.add('active-block');
                                cell.style.setProperty('--block-color', currentPiece.color);
                            }
                        }
                    });
                });
            }
        }

        function drop() {
            if (!currentPiece.checkCollision(currentPiece.y + 1, currentPiece.x)) {
                currentPiece.y++;
            } else {
                lockPiece();
            }
            dropCounter = 0;
        }

        function lockPiece() {
            currentPiece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        const y = currentPiece.y + r;
                        const x = currentPiece.x + c;
                        if (y >= 0) {
                            board[y][x] = currentPiece.color;
                        }
                    }
                });
            });
            clearLines();
            currentPiece = createPiece();
            if (currentPiece.checkCollision(0, 0)) {
                gameOver();
            }
        }

        function clearLines() {
            let linesClearedInThisMove = 0;
            for (let y = GRID_HEIGHT - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== null)) {
                    board.splice(y, 1);
                    board.push(Array(GRID_WIDTH).fill(null));
                    linesClearedInThisMove++;
                    y++; // Check the same index again
                }
            }

            if (linesClearedInThisMove > 0) {
                lines += linesClearedInThisMove;
                combo += linesClearedInThisMove;
                score += (linesClearedInThisMove * 100) * (1 + combo * 0.5);
                
                // Visual feedback for combo
                comboElement.classList.add('combo-flash');
                setTimeout(() => comboElement.classList.remove('combo-flat'), 300);

                updateUI();
            } else {
                combo = 0;
                updateUI();
            }
        }

        function updateUI() {
            scoreElement.innerText = Math.floor(score);
            linesElement.innerText = lines;
            comboElement.innerText = combo;
        }

        function gameOver() {
            gameActive = false;
            overlayTitle.innerText = "GAME OVER";
            startBtn.innerText = "Try Again";
            overlay.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            lines = 0;
            combo = 0;
            updateUI();
            initBoard();
            currentPiece = createPiece();
            gameActive = true;
            overlay.classList.add('hidden');
            lastTime = 0;
        }

        function gameLoop(time = 0) {
            if (!gameActive) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                drop();
            }

            updateGridDOM();
            requestAnimationFrame(gameLoop);
        }

        // Controls
        window.addEventListener('keydown', event => {
            if (!gameActive) return;

            switch (event.key) {
                case 'ArrowLeft':
                    if (!currentPiece.checkCollision(0, currentPiece.x - 1)) {
                        currentPiece.x--;
                    }
                    break;
                case 'ArrowRight':
                    if (!currentPiece.checkCollision(0, currentPiece.x + 1)) {
                        currentPiece.x++;
                    }
                    break;
                case 'ArrowDown':
                    drop();
                    break;
                case 'ArrowUp':
                    currentPiece.rotate();
                    break;
                case 'q':
                    currentPiece.rotate();
                    break;
                case 'e':
                    // Mirror rotation logic if needed
                    break;
            }
        });

        startBtn.addEventListener('click', () => {
            resetGame();
            requestAnimationFrame(gameLoop);
        });

        // Init on load
        initGrid();
        initBoard();
    </script>
</body>
</html>
