<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
            flex-direction: column;
        }
        h1 {
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        canvas {
            background-color: #34495e;
            border: 5px solid #f1c40f;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #game-info {
            margin-top: 20px;
            font-size: 1.2em;
            display: flex;
            gap: 30px;
        }
        #score, #game-over {
            padding: 10px 20px;
            background-color: #e74c3c;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #score {
            background-color: #27ae60;
        }
        #game-over {
            display: none; /* Hidden by default */
            background-color: #e74c3c;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="game-info">
        <div id="score">Score: 0</div>
        <div id="game-over">Game Over! Press 'R' to Restart</div>
    </div>
    <button id="startButton">Start Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('game-over');
        const startButton = document.getElementById('startButton');

        const gridSize = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 150; // Milliseconds
        let gameStarted = false;

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)),
                y: Math.floor(Math.random() * (canvas.height / gridSize))
            };

            // Ensure food doesn't spawn on the snake
            for (let i = 0; i < snake.length; i++) {
                if (food.x === snake[i].x && food.y === snake[i].y) {
                    generateFood();
                    return;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? '#2ecc71' : '#27ae60'; // Head color different
                ctx.strokeStyle = '#2c3e50';
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
                ctx.strokeRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize, gridSize);
            }

            // Draw food
            ctx.fillStyle = '#e74c3c';
            ctx.strokeStyle = '#c0392b';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        function update() {
            if (!gameStarted) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check for wall collision
            if (
                head.x < 0 || head.x >= canvas.width / gridSize ||
                head.y < 0 || head.y >= canvas.height / gridSize
            ) {
                endGame();
                return;
            }

            // Check for self-collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head); // Add new head

            // Check for food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                generateFood();
                // Increase speed slightly
                clearInterval(gameInterval);
                gameSpeed = Math.max(50, gameSpeed - 5); // Minimum speed of 50ms
                gameInterval = setInterval(update, gameSpeed);
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            draw();
        }

        function changeDirection(event) {
            if (!gameStarted) return;

            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingLeft = dx === -1;
            const goingRight = dx === 1;

            if (keyPressed === LEFT && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function startGame() {
            gameStarted = true;
            startButton.style.display = 'none';
            gameOverDisplay.style.display = 'none';
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            snake = [{ x: 10, y: 10 }];
            dx = 1; // Initial direction to the right
            dy = 0;
            gameSpeed = 150;
            generateFood();
            draw();
            clearInterval(gameInterval); // Clear any existing interval
            gameInterval = setInterval(update, gameSpeed);
        }

        function endGame() {
            gameStarted = false;
            clearInterval(gameInterval);
            gameOverDisplay.style.display = 'block';
            startButton.textContent = 'Restart Game';
            startButton.style.display = 'block';
        }

        document.addEventListener('keydown', changeDirection);
        document.addEventListener('keydown', (event) => {
            if (event.keyCode === 82 && !gameStarted) { // 'R' key
                startGame();
            }
        });
        startButton.addEventListener('click', startGame);

        // Initial setup
        generateFood();
        draw(); // Draw initial snake and food
    </script>
</body>
</html>
