<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f7;
        }

        .calculator {
            width: 320px;
            background-color: #000;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .display {
            background-color: #000;
            color: white;
            font-size: 72px;
            text-align: right;
            padding: 15px 20px;
            margin-bottom: 15px;
            min-height: 80px;
            overflow: hidden;
            word-wrap: break-word;
        }

        .display.small {
            font-size: 48px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-gray {
            background-color: #333333;
            color: white;
        }

        .btn-dark-gray {
            background-color: #737373;
            color: white;
        }

        .btn-orange {
            background-color: #ff9f0a;
            color: white;
        }

        .btn-light-gray {
            background-color: #d4d4d2;
            color: black;
        }

        .zero-btn {
            grid-column: span 2;
            width: auto;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 28px;
        }

        button:hover {
            opacity: 0.9;
        }

        .operator-btn.active {
            background-color: white;
            color: #ff9f0a;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn-light-gray" onclick="clearDisplay()">AC</button>
            <button class="btn-dark-gray" onclick="toggleSign()">+/-</button>
            <button class="btn-dark-gray" onclick="percentage()">%</button>
            <button class="operator-btn btn-orange" id="divide" onclick="setOperator('/')">÷</button>

            <button class="btn-gray" onclick="appendNumber('7')">7</button>
            <button class="btn-gray" onclick="appendNumber('8')">8</button>
            <button class="btn-gray" onclick="appendNumber('9')">9</button>
            <button class="operator-btn btn-orange" id="multiply" onclick="setOperator('*')">×</button>

            <button class="btn-gray" onclick="appendNumber('4')">4</button>
            <button class="btn-gray" onclick="appendNumber('5')">5</button>
            <button class="btn-gray" onclick="appendNumber('6')">6</button>
            <button class="operator-btn btn-orange" id="subtract" onclick="setOperator('-')">−</button>

            <button class="btn-gray" onclick="appendNumber('1')">1</button>
            <button class="btn-gray" onclick="appendNumber('2')">2</button>
            <button class="btn-gray" onclick="appendNumber('3')">3</button>
            <button class="operator-btn btn-orange" id="add" onclick="setOperator('+')">+</button>

            <button class="zero-btn btn-gray" onclick="appendNumber('0')">0</button>
            <button class="btn-gray" onclick="appendDecimal()">.</button>
            <button class="btn-orange" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;

        const displayElement = document.getElementById('display');
        const operatorButtons = ['divide', 'multiply', 'subtract', 'add'];

        function updateDisplay() {
            displayElement.textContent = currentInput;
            
            if (currentInput.length > 8) {
                displayElement.classList.add('small');
            } else {
                displayElement.classList.remove('small');
            }
        }

        function appendNumber(number) {
            if (shouldResetDisplay) {
                currentInput = '';
                shouldResetDisplay = false;
                clearOperatorHighlight();
            }
            
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '';
                shouldResetDisplay = false;
                clearOperatorHighlight();
            }
            
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            
            updateDisplay();
        }

        function setOperator(op) {
            if (operator !== null && !shouldResetDisplay) {
                calculateResult();
            }
            
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            
            clearOperatorHighlight();
            document.getElementById(op === '/' ? 'divide' : 
                                   op === '*' ? 'multiply' : 
                                   op === '-' ? 'subtract' : 'add').classList.add('active');
        }

        function calculateResult() {
            if (operator === null || shouldResetDisplay) return;
            
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            switch(operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert('Cannot divide by zero');
                        clearDisplay();
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }
            
            // Handle floating point precision issues
            result = Math.round(result * 1000000) / 1000000;
            
            currentInput = result.toString();
            operator = null;
            shouldResetDisplay = true;
            clearOperatorHighlight();
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            clearOperatorHighlight();
            displayElement.classList.remove('small');
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === '0') return;
            
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function percentage() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        function clearOperatorHighlight() {
            operatorButtons.forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '.') appendDecimal();
            else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') setOperator(e.key);
            else if (e.key === 'Enter' || e.key === '=') calculateResult();
            else if (e.key === 'Escape') clearDisplay();
            else if (e.key === 'Backspace') {
                currentInput = currentInput.slice(0, -1) || '0';
                updateDisplay();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
