<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zaraban</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-elev: #171717;
      --bg-soft: #1f1f1f;
      --panel: #131313;
      --border: #2c2c2c;
      --text: #e0e0e0;
      --muted: #888888;
      --accent: #87d7ff;
      --green: #79d98f;
      --red: #ff7b72;
      --amber: #f0b35a;
      --purple: #c59bff;
      --cyan: #7fd5e6;
      --blue-dim: #7ca6d6;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
    }

    body[data-theme="light"] {
      --bg: #f3f1eb;
      --bg-elev: #ffffff;
      --bg-soft: #ece7dc;
      --panel: #f8f4eb;
      --border: #d7cfc1;
      --text: #2a241d;
      --muted: #72685b;
      --accent: #1d6ca1;
      --green: #237d43;
      --red: #b53a2d;
      --amber: #9a6508;
      --purple: #7850ba;
      --cyan: #136f7f;
      --blue-dim: #456ea5;
      --shadow: 0 14px 40px rgba(69, 57, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: 48px 1fr;
      background: radial-gradient(circle at top left, rgba(135, 215, 255, 0.08), transparent 28%),
        radial-gradient(circle at bottom right, rgba(240, 179, 90, 0.08), transparent 22%),
        var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", monospace;
    }

    body.thinking-hidden .main-grid {
      grid-template-columns: 0 minmax(0, 1fr) 320px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .status-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      justify-self: center;
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .provider-summary {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(255, 123, 114, 0.14);
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(121, 217, 143, 0.16);
    }

    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
    }

    .provider-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--bg-soft) 88%, transparent);
    }

    .provider-switch button {
      min-width: 64px;
    }

    .topbar button {
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .topbar button:hover {
      border-color: var(--accent);
    }

    .topbar button.active {
      background: color-mix(in srgb, var(--accent) 14%, var(--bg-soft));
      border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
    }

    .topbar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .main-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 320px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
    }

    .panel:last-child {
      border-right: 0;
    }

    .thinking-panel {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body.thinking-hidden .thinking-panel {
      border-right: 0;
      opacity: 0;
      pointer-events: none;
    }

    .panel-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-head .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .panel-head .subtle {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .thinking-stream {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
      box-shadow: var(--shadow);
      overflow: hidden;
      flex-shrink: 0;
    }

    .event-header {
      padding: 9px 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: default;
    }

    .event-main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .event-name {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.4;
    }

    .event-preview {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .event-time {
      color: var(--muted);
      white-space: nowrap;
      font-size: 10px;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .event-payload {
      margin: 0;
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      overflow: auto;
      max-height: 260px;
      font-size: 11px;
      line-height: 1.55;
      color: var(--text);
      background: rgba(0, 0, 0, 0.15);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .event-llm .event-name    { color: var(--blue-dim); }
    .event-plan .event-name   { color: var(--amber); }
    .event-memory .event-name { color: var(--purple); }
    .event-route .event-name  { color: var(--cyan); }
    .event-step .event-name   { color: var(--green); }
    .event-step.failed .event-name { color: var(--red); }
    .event-route-decision .event-name { color: var(--cyan); }

    .thinking-panel .panel-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      row-gap: 2px;
    }

    .thinking-panel .panel-head .subtle {
      flex: 1;
      margin-top: 0;
    }

    .panel-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .panel-action-btn {
      background: color-mix(in srgb, var(--bg-soft) 90%, transparent);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      font-weight: 600;
    }

    .panel-action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--bg-soft));
    }

    .chat-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent 25%), transparent;
    }

    .banner {
      display: none;
      padding: 10px 14px;
      border-bottom: 1px solid color-mix(in srgb, var(--red) 55%, var(--border));
      background: color-mix(in srgb, var(--red) 10%, var(--bg-soft));
      font-size: 12px;
      color: var(--text);
    }

    .banner.visible {
      display: block;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 88%;
    }

    .message-row.user {
      margin-left: auto;
      align-items: flex-end;
    }

    .message-row.agent,
    .message-row.error {
      margin-right: auto;
      align-items: flex-start;
    }

    .message-name {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .bubble {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.55;
      box-shadow: var(--shadow);
      white-space: normal;
      word-break: break-word;
    }

    .message-row.user .bubble {
      background: color-mix(in srgb, var(--accent) 14%, var(--bg-soft));
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }

    .message-row.error .bubble {
      background: color-mix(in srgb, var(--red) 10%, var(--bg-soft));
      border-color: color-mix(in srgb, var(--red) 60%, var(--border));
    }

    .bubble pre {
      margin: 12px 0 0;
      padding: 12px;
      overflow: auto;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
    }

    .bubble code {
      font-family: inherit;
      font-size: 0.95em;
      background: rgba(0, 0, 0, 0.16);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
    }

    .message-meta {
      font-size: 10px;
      color: var(--muted);
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      min-height: 18px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      animation: pulse 1.1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.14s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.28s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      40% {
        transform: translateY(-2px);
        opacity: 1;
      }
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
    }

    .composer textarea {
      resize: none;
      min-height: 46px;
      max-height: 180px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      font: inherit;
      line-height: 1.45;
      outline: none;
    }

    .composer textarea:focus {
      border-color: var(--accent);
    }

    .composer button {
      align-self: end;
      min-width: 88px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
      background: color-mix(in srgb, var(--accent) 18%, var(--bg-soft));
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .composer button:disabled,
    .composer textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .plan-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .plan-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .plan-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .goal-card,
    .plan-empty,
    .milestone-card {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .goal-card {
      padding: 14px;
    }

    .goal-title {
      margin: 0 0 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .goal-text {
      line-height: 1.55;
    }

    .plan-empty {
      padding: 18px 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .milestone-card {
      padding: 12px 12px 10px;
    }

    .milestone-line,
    .step-line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .milestone-line {
      margin-bottom: 8px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-left: 18px;
      padding-left: 12px;
      border-left: 1px dashed color-mix(in srgb, var(--border) 85%, transparent);
    }

    .node-icon {
      width: 18px;
      text-align: center;
      color: var(--muted);
    }

    .node-title {
      line-height: 1.45;
    }

    .node-meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .skill-tag {
      color: var(--accent);
      margin-right: 8px;
    }

    .status-pending .node-icon,
    .status-pending .node-meta {
      color: var(--muted);
    }

    .status-running .node-icon,
    .status-running .node-meta {
      color: var(--amber);
    }

    .status-running .node-icon {
      animation: pulse 1.1s infinite ease-in-out;
    }

    .status-done .node-icon,
    .status-done .node-meta {
      color: var(--green);
    }

    .status-failed .node-icon,
    .status-failed .node-meta {
      color: var(--red);
    }
  </style>
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="brand">zaraban</div>
    <div class="status-wrap">
      <div class="status-line">
        <span id="connectionDot" class="status-dot"></span>
        <span id="connectionLabel">disconnected</span>
      </div>
      <div id="providerSummary" class="provider-summary">local primary</div>
    </div>
    <div class="topbar-actions">
      <div class="provider-switch" aria-label="Provider mode">
        <button id="localPrimaryButton" type="button">local</button>
        <button id="cloudPrimaryButton" type="button">cloud</button>
      </div>
      <button id="localModelButton" type="button" title="Switch local model">[model]</button>
      <button id="cloudModelButton" type="button" title="Switch cloud model">[cloud]</button>
      <button id="toggleThinking" class="active" type="button">[T]</button>
      <button id="toggleTheme" type="button">dark</button>
    </div>
  </header>

  <div class="main-grid">
    <aside class="panel thinking-panel">
      <div class="panel-head">
        <div class="label">Thinking</div>
        <div class="subtle">Live transparency stream</div>
        <div class="panel-actions">
          <button id="clear-log-btn" class="panel-action-btn" type="button" onclick="clearTransparencyLog()">[clear]</button>
          <button id="copy-log-btn" class="panel-action-btn" type="button" onclick="copyTransparencyLog()">[copy all]</button>
        </div>
      </div>
      <div id="thinkingStream" class="thinking-stream"></div>
    </aside>

    <main class="panel chat-panel">
      <div id="reconnectBanner" class="banner">Reconnecting...</div>
      <div id="messageList" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="chatInput" placeholder="Message zaraban..." rows="1"></textarea>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </main>

    <aside class="panel plan-panel">
      <div class="panel-head">
        <div class="label">Plan</div>
        <div class="subtle">Milestones and step status</div>
      </div>
      <div id="planBody" class="plan-body"></div>
    </aside>
  </div>

  <script>
    const state = {
      socket: null,
      connected: false,
      processing: false,
      provider: null,
      reconnectDelay: 3000,
      reconnectTimer: null,
      plan: null,
      stepNodes: new Map(),
      milestoneNodes: new Map(),
      runningSteps: new Map(),
      typingNode: null,
      transparencyLog: []
    };

    const elements = {
      body: document.body,
      thinkingStream: document.getElementById('thinkingStream'),
      messageList: document.getElementById('messageList'),
      planBody: document.getElementById('planBody'),
      chatInput: document.getElementById('chatInput'),
      sendButton: document.getElementById('sendButton'),
      composer: document.getElementById('composer'),
      reconnectBanner: document.getElementById('reconnectBanner'),
      connectionDot: document.getElementById('connectionDot'),
      connectionLabel: document.getElementById('connectionLabel'),
      providerSummary: document.getElementById('providerSummary'),
      localPrimaryButton: document.getElementById('localPrimaryButton'),
      cloudPrimaryButton: document.getElementById('cloudPrimaryButton'),
      localModelButton: document.getElementById('localModelButton'),
      cloudModelButton: document.getElementById('cloudModelButton'),
      toggleThinking: document.getElementById('toggleThinking'),
      toggleTheme: document.getElementById('toggleTheme')
    };

    const LOCAL_MODELS = [
      { id: 'google/gemma-4-26b-a4b', label: 'gemma' },
      { id: 'qwen/qwen3.5-35b-a3b',   label: 'qwen'  },
    ];

    const theme = localStorage.getItem('zaraban-theme') || 'dark';
    setTheme(theme);
    renderPlanEmpty();
    syncProviderUi();
    connect();
    window.setInterval(updateElapsedLabels, 1000);

    elements.toggleThinking.addEventListener('click', () => {
      elements.body.classList.toggle('thinking-hidden');
      elements.toggleThinking.classList.toggle('active', !elements.body.classList.contains('thinking-hidden'));
    });

    elements.toggleTheme.addEventListener('click', () => {
      setTheme(elements.body.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    elements.localPrimaryButton.addEventListener('click', () => {
      sendProviderMode('local');
    });

    elements.cloudPrimaryButton.addEventListener('click', () => {
      sendProviderMode('cloud');
    });

    elements.localModelButton.addEventListener('click', () => {
      // Cycle to next local model
      const current = state.provider ? state.provider.primaryLabel : '';
      const idx = LOCAL_MODELS.findIndex(m => current.includes(m.label) || current === m.id);
      const next = LOCAL_MODELS[(idx + 1) % LOCAL_MODELS.length];
      sendLocalModel(next.id);
    });

    elements.cloudModelButton.addEventListener('click', () => {
      // Cycle to next cloud model
      const available = state.provider ? (state.provider.availableCloudModels || []) : [];
      if (available.length < 2) return;
      const current = state.provider ? state.provider.activeCloudModel : '';
      const idx = available.indexOf(current);
      const next = available[(idx + 1) % available.length];
      sendCloudModel(next);
    });

    elements.chatInput.addEventListener('input', () => {
      autoResize();
      syncComposer();
    });

    elements.chatInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendCurrentMessage();
      }
    });

    elements.composer.addEventListener('submit', event => {
      event.preventDefault();
      sendCurrentMessage();
    });

    window.addEventListener('keydown', event => {
      const target = event.target;
      const typingTarget = target instanceof HTMLElement && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA');
      if (!typingTarget && event.key.toLowerCase() === 't' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        elements.toggleThinking.click();
      }
    });

    function setTheme(nextTheme) {
      elements.body.dataset.theme = nextTheme;
      elements.toggleTheme.textContent = nextTheme;
      localStorage.setItem('zaraban-theme', nextTheme);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderMarkdown(text) {
      const blocks = [];
      let working = text.replace(/```([\s\S]*?)```/g, (_, code) => {
        const html = '<pre><code>' + escapeHtml(code.replace(/^\n+|\n+$/g, '')) + '</code></pre>';
        const index = blocks.push(html) - 1;
        return '@@BLOCK' + index + '@@';
      });

      working = escapeHtml(working)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');

      return working.replace(/@@BLOCK(\d+)@@/g, (_, index) => blocks[Number(index)] || '');
    }

    function formatClock(ts) {
      const date = new Date(ts);
      const main = date.toLocaleTimeString([], { hour12: false });
      return main + '.' + String(date.getMilliseconds()).padStart(3, '0');
    }

    function formatDuration(ms) {
      if (ms < 1000) return ms + 'ms';
      const seconds = Math.round(ms / 100) / 10;
      if (seconds < 60) return seconds + 's';
      const minutes = Math.floor(seconds / 60);
      const remainder = Math.round(seconds % 60);
      return minutes + 'm ' + remainder + 's';
    }

    function shortText(text, max = 140) {
      return text.length > max ? text.slice(0, max - 3) + '...' : text;
    }

    function autoResize() {
      elements.chatInput.style.height = 'auto';
      elements.chatInput.style.height = Math.min(elements.chatInput.scrollHeight, 180) + 'px';
    }

    function syncComposer() {
      const disabled = !state.connected || state.processing;
      elements.chatInput.disabled = disabled;
      elements.sendButton.disabled = disabled || !elements.chatInput.value.trim();
    }

    function syncProviderUi() {
      const provider = state.provider;
      const available = provider ? provider.availableModes : [];
      const activeMode = provider ? provider.mode : null;
      const disabled = !state.connected;

      elements.localPrimaryButton.disabled = disabled || !available.includes('local');
      elements.cloudPrimaryButton.disabled = disabled || !available.includes('cloud');
      elements.localPrimaryButton.classList.toggle('active', activeMode === 'local');
      elements.cloudPrimaryButton.classList.toggle('active', activeMode === 'cloud');

      // Update local model toggle button
      const primaryLabel = provider ? provider.primaryLabel : '';
      const knownModel = LOCAL_MODELS.find(m => primaryLabel.includes(m.label) || primaryLabel === m.id);
      elements.localModelButton.textContent = '[' + (knownModel ? knownModel.label : 'model') + ']';
      elements.localModelButton.disabled = disabled || activeMode !== 'local';

      // Update cloud model toggle button
      const cloudModels = provider ? (provider.availableCloudModels || []) : [];
      const activeCloud = provider ? provider.activeCloudModel : '';
      elements.cloudModelButton.textContent = '[' + (activeCloud || 'cloud') + ']';
      elements.cloudModelButton.disabled = disabled || activeMode !== 'cloud' || cloudModels.length < 2;

      if (!provider) {
        elements.providerSummary.textContent = 'provider unavailable';
        return;
      }

      const chain = provider.fallbackLabel
        ? provider.primaryLabel + ' -> ' + provider.fallbackLabel
        : provider.primaryLabel;
      elements.providerSummary.textContent = provider.mode + ' primary · ' + chain;
    }

    function sendProviderMode(mode) {
      if (!state.connected || !state.socket) return;
      localStorage.setItem('zaraban-provider-mode', mode);
      state.socket.send(JSON.stringify({ type: 'set_provider_mode', mode }));
    }

    function sendLocalModel(modelId) {
      if (!state.connected || !state.socket) return;
      state.socket.send(JSON.stringify({ type: 'set_local_model', model: modelId }));
    }

    function sendCloudModel(modelId) {
      if (!state.connected || !state.socket) return;
      state.socket.send(JSON.stringify({ type: 'set_cloud_model', model: modelId }));
    }

    function appendMessage(role, text, options = {}) {
      const row = document.createElement('div');
      row.className = 'message-row ' + (options.error ? 'error' : role);

      const name = document.createElement('div');
      name.className = 'message-name';
      name.textContent = role === 'user' ? 'you' : 'zaraban';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = renderMarkdown(text);

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = formatClock(Date.now()) + (options.intent ? '  [' + options.intent + ']' : '');

      row.append(name, bubble, meta);
      elements.messageList.appendChild(row);
      elements.messageList.scrollTop = elements.messageList.scrollHeight;
      return row;
    }

    function showTyping() {
      if (state.typingNode) return;
      const row = document.createElement('div');
      row.className = 'message-row agent';

      const name = document.createElement('div');
      name.className = 'message-name';
      name.textContent = 'zaraban';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';

      row.append(name, bubble);
      elements.messageList.appendChild(row);
      elements.messageList.scrollTop = elements.messageList.scrollHeight;
      state.typingNode = row;
    }

    function hideTyping() {
      if (!state.typingNode) return;
      state.typingNode.remove();
      state.typingNode = null;
    }

    function setConnected(connected) {
      state.connected = connected;
      elements.connectionDot.classList.toggle('connected', connected);
      elements.connectionLabel.textContent = connected ? 'connected' : 'disconnected';
      elements.reconnectBanner.classList.toggle('visible', !connected);
      if (!connected) {
        state.processing = false;
        hideTyping();
      }
      syncComposer();
      syncProviderUi();
    }

    function connect() {
      const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(scheme + '://' + window.location.host + '/ws');
      state.socket = socket;

      socket.addEventListener('open', () => {
        if (state.reconnectTimer) {
          window.clearTimeout(state.reconnectTimer);
          state.reconnectTimer = null;
        }
        state.reconnectDelay = 3000;
        setConnected(true);

        const storedMode = localStorage.getItem('zaraban-provider-mode');
        if (storedMode === 'local' || storedMode === 'cloud') {
          socket.send(JSON.stringify({ type: 'set_provider_mode', mode: storedMode }));
        }
      });

      socket.addEventListener('message', event => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.type === 'agent_reply') {
          hideTyping();
          state.processing = false;
          appendMessage('agent', payload.text, { intent: payload.intent });
          syncComposer();
          return;
        }

        if (payload.type === 'provider_status') {
          state.provider = payload.provider;
          syncProviderUi();
          return;
        }

        if (payload.type === 'transparency') {
          addTransparencyEvent(payload.event, payload.payload, payload.ts);
          return;
        }

        if (payload.type === 'plan_update') {
          renderPlan(payload.plan);
          return;
        }

        if (payload.type === 'step_update') {
          applyStepUpdate(payload.stepId, payload.status, payload.elapsed);
          return;
        }

        if (payload.type === 'milestone_update') {
          applyMilestoneUpdate(payload.milestoneId, payload.status);
          return;
        }

        if (payload.type === 'error') {
          hideTyping();
          state.processing = false;
          appendMessage('agent', payload.message, { error: true });
          syncComposer();
        }
      });

      socket.addEventListener('close', () => {
        setConnected(false);
        scheduleReconnect();
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    function scheduleReconnect() {
      if (state.reconnectTimer) return;
      const delay = state.reconnectDelay;
      state.reconnectTimer = window.setTimeout(() => {
        state.reconnectTimer = null;
        connect();
      }, delay);
      state.reconnectDelay = Math.min(Math.round(delay * 1.6), 30000);
    }

    function sendCurrentMessage() {
      const text = elements.chatInput.value.trim();
      if (!text || !state.connected || state.processing || !state.socket) return;
      appendMessage('user', text);
      state.processing = true;
      showTyping();
      elements.chatInput.value = '';
      autoResize();
      syncComposer();
      state.socket.send(JSON.stringify({ type: 'chat', text }));
    }

    function addTransparencyEvent(event, payload, ts) {
      const stream = elements.thinkingStream;
      const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 60;

      state.transparencyLog.push({ event, payload, ts });
      while (state.transparencyLog.length > 200) {
        state.transparencyLog.shift();
      }

      const row = document.createElement('article');
      row.className = 'event-row ' + eventThemeClass(event, payload);

      const header = document.createElement('div');
      header.className = 'event-header';

      const main = document.createElement('div');
      main.className = 'event-main';

      const name = document.createElement('div');
      name.className = 'event-name';
      name.textContent = event;

      const preview = document.createElement('div');
      preview.className = 'event-preview';
      preview.textContent = eventPreview(event, payload);

      const time = document.createElement('div');
      time.className = 'event-time';
      time.textContent = formatClock(ts);

      main.append(name, preview);
      header.append(main, time);

      const pre = document.createElement('pre');
      pre.className = 'event-payload';
      pre.textContent = JSON.stringify(payload, null, 2);

      row.append(header, pre);

      while (stream.children.length > 200) {
        stream.removeChild(stream.firstChild);
      }

      stream.appendChild(row);

      if (nearBottom) {
        stream.scrollTop = stream.scrollHeight;
      }
    }

    function buildTransparencyLogText() {
      const events = state.transparencyLog.map(entry => {
        const preview = eventPreview(entry.event, entry.payload);
        const payloadText = JSON.stringify(entry.payload, null, 2);
        return [
          '[' + formatClock(entry.ts) + '] ' + entry.event,
          preview ? preview : '(no preview)',
          payloadText
        ].join('\n');
      }).join('\n\n' + '-'.repeat(72) + '\n\n');
      const header = 'Zaraban Transparency Log — ' + new Date().toLocaleString() + '\n' + '='.repeat(60) + '\n\n';
      return header + events;
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          document.body.removeChild(textarea);
          resolve();
        } catch (error) {
          document.body.removeChild(textarea);
          reject(error);
        }
      });
    }

    function copyTransparencyLog() {
      const text = buildTransparencyLogText();
      copyTextToClipboard(text).then(() => {
        const btn = document.getElementById('copy-log-btn');
        if (btn) {
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = '[copy all]'; }, 1500);
        }
      }).catch(() => {});
    }

    function clearTransparencyLog() {
      state.transparencyLog = [];
      elements.thinkingStream.innerHTML = '';
    }

    function eventThemeClass(event, payload) {
      if (event.startsWith('llm_')) return 'event-llm';
      if (event === 'plan' || event.startsWith('milestone_')) return 'event-plan';
      if (event.startsWith('step_')) return payload && payload.result && payload.result.success === false ? 'event-step failed' : 'event-step';
      if (event === 'memory_write') return 'event-memory';
      if (event === 'decomposition' || event === 'intent' || event === 'unit_memory_search') return 'event-route';
      if (event === 'route') return 'event-route-decision';
      return '';
    }

    function eventPreview(event, payload) {
      if (event === 'llm_raw' || event === 'llm_stripped') {
        const text = (payload.text || payload.raw || payload.content || '').trim();
        const preview = shortText(text, 300);
        const suffix = text.length > 300 ? '…' : '';
        const ms = payload.ms || payload.elapsed ? '  (' + (payload.ms || payload.elapsed) + 'ms)' : '';
        return preview + suffix + ms;
      }
      if (event === 'llm_request') {
        return (payload.messages ? payload.messages.length : 0) + ' messages';
      }
      if (event === 'decomposition' && Array.isArray(payload.units)) {
        return payload.units.map(unit => '[' + unit.route + '] ' + unit.content).join('\n');
      }
      if (event === 'plan') {
        const milestones = Array.isArray(payload.milestones) ? payload.milestones : (payload.plan && Array.isArray(payload.plan.milestones) ? payload.plan.milestones : []);
        const goal = (payload.goal || (payload.plan && payload.plan.goal) || '').slice(0, 80);
        if (milestones.length > 0) {
          return goal + '\n' + milestones.map((m, i) => '  M' + (i + 1) + '. ' + (m.title || m.description || '')).join('\n');
        }
        return goal;
      }
      if (event === 'step_start' && payload.step) {
        return '▶ [' + payload.step.skill + ']  ' + shortText(payload.step.description, 80);
      }
      if (event === 'step_result' && payload.step) {
        const icon = payload.result && payload.result.success !== false ? '✓' : '✗';
        return icon + ' [' + (payload.step.skill || '?') + ']  ' + (payload.ms || 0) + 'ms';
      }
      if (event === 'memory_write') {
        return '💾 ' + (payload.code || '') + '  ' + (payload.name || '');
      }
      if (event === 'unit_memory_search' && payload.unit) {
        return payload.unit.route + '  ' + payload.result.strategy + '  conf=' + payload.result.confidence;
      }
      if (event === 'milestone_start' || event === 'milestone_result') {
        const icon = event === 'milestone_result' ? (payload.success !== false ? '✓' : '✗') + ' ' : '';
        return icon + (payload.title || payload.id || '');
      }
      if (event === 'route') {
        return (payload.path === 'query_loop' ? '⚡ QueryLoop' : '🗺 Planner') +
          '  [' + (payload.level || '') + ']  ' + (payload.reason || '');
      }
      if (event === 'working_memory_created') return '🧠 Created: ' + shortText(payload.goal || '', 60);
      if (event === 'working_memory_updated') return '🧠 Updated (' + (payload.type || 'step') + ')';
      if (event === 'working_memory_archived') return '🧠 Archived';
      if (event === 'session_cache_hit') return '⚡ Cache hit: ' + (payload.code || '');
      if (event === 'session_cache_miss') return '○ Cache miss: ' + (payload.code || '');
      if (event === 'project_brain' || event === 'project_brain_hit') return '🧩 Brain: ' + (payload.projectCode || '');
      if (event === 'query_loop_start') return '⟳ Goal: ' + shortText(payload.goal || '', 80);
      if (event === 'query_loop_iteration') return '⟳ Iter ' + (payload.iteration || '') + ': ' + shortText(payload.reply || '', 100);
      if (event === 'query_loop_narration') return '💬 ' + shortText(payload.narration || '', 120);
      if (event === 'query_loop_skill_call') return '▶ [' + (payload.skill || '') + '] ' + shortText(JSON.stringify(payload.input || {}), 60);
      if (event === 'query_loop_skill_result') return (payload.success !== false ? '✓' : '✗') + ' [' + (payload.skill || '') + ']' + (payload.error ? '  ' + payload.error : '');
      if (event === 'query_loop_end') return '⟳ Done (' + (payload.reason || '') + ') after ' + (payload.iterations || '') + ' iters';
      return shortText(JSON.stringify(payload), 180);
    }

    function renderPlan(plan) {
      state.plan = plan;
      state.stepNodes = new Map();
      state.milestoneNodes = new Map();
      state.runningSteps = new Map();
      elements.planBody.innerHTML = '';

      const summary = document.createElement('div');
      summary.className = 'plan-summary';
      summary.innerHTML = '<span>plan</span><span>complexity: ' + escapeHtml(plan.complexity || 'LOW') + '</span>';

      const goalCard = document.createElement('div');
      goalCard.className = 'goal-card';
      goalCard.innerHTML = '<div class="goal-title">Goal</div><div class="goal-text">' + renderMarkdown(plan.goal || 'Untitled plan') + '</div>';

      elements.planBody.append(summary, goalCard);

      const milestones = Array.isArray(plan.milestones) ? plan.milestones : [];
      if (milestones.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'plan-empty';
        empty.textContent = 'No active plan. Agentic tasks will appear here.';
        elements.planBody.appendChild(empty);
        return;
      }

      milestones.forEach((milestone, index) => {
        const card = document.createElement('div');
        card.className = 'milestone-card status-' + (milestone.status || 'pending');

        const line = document.createElement('div');
        line.className = 'milestone-line';

        const icon = document.createElement('div');
        icon.className = 'node-icon';
        icon.innerHTML = statusIcon(milestone.status);

        const title = document.createElement('div');
        title.className = 'node-title';
        title.innerHTML = '<strong>M' + (index + 1) + '</strong>  ' + escapeHtml(milestone.title);

        const meta = document.createElement('div');
        meta.className = 'node-meta';
        meta.textContent = milestone.status || 'pending';

        line.append(icon, title, meta);
        card.appendChild(line);

        if (milestone.description || milestone.completionCriteria) {
          const detail = document.createElement('div');
          detail.className = 'node-meta';
          detail.style.margin = '0 0 10px 28px';
          detail.style.whiteSpace = 'normal';
          detail.textContent = milestone.description || milestone.completionCriteria;
          card.appendChild(detail);
        }

        const stepsWrap = document.createElement('div');
        stepsWrap.className = 'step-list';
        card.appendChild(stepsWrap);

        (milestone.steps || []).forEach(step => {
          const stepLine = document.createElement('div');
          stepLine.className = 'step-line status-' + (step.status || 'pending');

          const stepIcon = document.createElement('div');
          stepIcon.className = 'node-icon';
          stepIcon.innerHTML = statusIcon(step.status);

          const stepTitle = document.createElement('div');
          stepTitle.className = 'node-title';
          stepTitle.innerHTML = '<span class="skill-tag">' + escapeHtml(step.skill) + '</span>' + escapeHtml(shortText(step.description, 80));

          const stepMeta = document.createElement('div');
          stepMeta.className = 'node-meta';
          stepMeta.textContent = step.status || 'pending';

          stepLine.append(stepIcon, stepTitle, stepMeta);
          stepsWrap.appendChild(stepLine);

          state.stepNodes.set(step.id, {
            line: stepLine,
            icon: stepIcon,
            meta: stepMeta
          });

          if (step.status === 'running') {
            state.runningSteps.set(step.id, {
              startedAt: Date.now() - (step.elapsedMs || 0),
              meta: stepMeta
            });
          } else if (typeof step.elapsedMs === 'number') {
            stepMeta.textContent = step.status + '  ' + formatDuration(step.elapsedMs);
          }
        });

        state.milestoneNodes.set(milestone.id, {
          line: card,
          icon,
          meta
        });

        elements.planBody.appendChild(card);
      });
    }

    function renderPlanEmpty() {
      state.plan = null;
      state.stepNodes = new Map();
      state.milestoneNodes = new Map();
      state.runningSteps = new Map();
      elements.planBody.innerHTML = '';

      const summary = document.createElement('div');
      summary.className = 'plan-summary';
      summary.innerHTML = '<span>plan</span><span>idle</span>';

      const empty = document.createElement('div');
      empty.className = 'plan-empty';
      empty.innerHTML = 'No active plan.<br>Agentic tasks will appear here.';

      elements.planBody.append(summary, empty);
    }

    function statusIcon(status) {
      if (status === 'running') return '&#9679;';
      if (status === 'done') return '&#10003;';
      if (status === 'failed') return '&#10007;';
      return '&#9675;';
    }

    function applyStepUpdate(stepId, status, elapsed) {
      const node = state.stepNodes.get(stepId);
      if (!node) return;

      node.line.className = 'step-line status-' + status;
      node.icon.innerHTML = statusIcon(status);

      if (status === 'running') {
        state.runningSteps.set(stepId, {
          startedAt: Date.now(),
          meta: node.meta
        });
        node.meta.textContent = 'running';
        return;
      }

      state.runningSteps.delete(stepId);
      node.meta.textContent = elapsed ? status + '  ' + formatDuration(elapsed) : status;
    }

    function applyMilestoneUpdate(milestoneId, status) {
      const node = state.milestoneNodes.get(milestoneId);
      if (!node) return;
      node.line.className = 'milestone-card status-' + status;
      node.icon.innerHTML = statusIcon(status);
      node.meta.textContent = status;
    }

    function updateElapsedLabels() {
      state.runningSteps.forEach((item) => {
        item.meta.textContent = 'running  ' + formatDuration(Date.now() - item.startedAt);
      });
    }
  </script>
